[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotquality"
version = "1.0.0"
description = "NBA shot quality: expected field-goal percentage, expected points, and shot-making over expected."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Julian Calas" }]
dependencies = [
    "nba_api==1.12.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "duckdb==2.0.0",
    "pyarrow==26.0.0",
    "joblib==1.6.0",
    "scipy==1.18.1",
]

[project.optional-dependencies]
app = ["streamlit==1.66.1"]
notebook = ["jupyter==1.1.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
